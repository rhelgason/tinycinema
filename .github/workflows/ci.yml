name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: yt-dlp extra installs cleanly
        run: pip install -e ".[youtube]"

      - name: Test
        run: pytest -q

      # The test suite deliberately avoids ffmpeg and a real tty, so these two
      # cover what it can't: that the console script is wired up, and that piped
      # output really is plain text.
      - name: Smoke test
        run: |
          tinycinema --version
          tinycinema --doctor || true   # exits 1 without ffmpeg, which is fine
          tinycinema --demo --width 40 --height 12 --stats

      - name: Piped output must contain no escape sequences
        shell: bash
        run: |
          tinycinema --demo mandelbrot --width 40 --height 12 > frame.txt
          python - <<'EOF'
          # Python rather than grep -P: BSD grep on macOS has no -P.
          text = open("frame.txt").read()
          assert "\x1b" not in text, "escape sequences leaked into piped output"
          lines = text.rstrip("\n").split("\n")
          assert len(lines) == 12, f"expected 12 rows, got {len(lines)}"
          assert all(len(x) == 40 for x in lines), "rows are not 40 cells wide"
          print("piped output is clean")
          EOF

  playback:
    name: real playback (ubuntu, ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"

      - name: Decode an actual video
        run: |
          ffmpeg -y -loglevel error -f lavfi \
            -i "testsrc2=size=320x180:rate=30:duration=2" -f lavfi \
            -i "sine=frequency=440:duration=2" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/clip.mp4
          tinycinema /tmp/clip.mp4 --once --width 60 --height 20 --mode ascii
          tinycinema /tmp/clip.mp4 --once --width 60 --height 20 --mode halfblock \
            > /dev/null
          tinycinema /tmp/clip.mp4 --stats --width 60 --height 20 --fps 10 --no-audio

      # A CI runner has ffplay but no sound card, so ffplay dies immediately.
      # That is exactly the failure the clock is built to survive: it must fall
      # back to wall time and keep playing rather than freeze on frame one.
      #
      # Run it under `script` to get a real pty: piped stdout implies --once,
      # which would render a single frame and never exercise the timing loop.
      - name: Audio failure degrades instead of hanging
        timeout-minutes: 2
        shell: bash
        run: |
          script -qec "tinycinema /tmp/clip.mp4 --stats --no-hud \
            --width 60 --height 20 > /dev/null" /dev/null | tr -d '\r' > out.txt || true
          cat out.txt
          python - <<'EOF'
          import re
          text = open("out.txt").read()
          m = re.search(r"rendered (\d+) frames in ([\d.]+)s", text)
          assert m, f"no stats line in output:\n{text}"
          frames, secs = int(m.group(1)), float(m.group(2))
          # 2s clip at 30fps. Anything near 60 means the loop really ran; a
          # freeze on frame one, or a 1-frame --once, would fail here.
          assert frames > 30, f"only {frames} frames -- the loop stalled"
          assert secs < 6, f"took {secs}s for a 2s clip -- audio failure hung it"
          print(f"OK: {frames} frames in {secs}s with no working audio device")
          EOF

      - name: Every render mode produces output
        shell: bash
        run: |
          for mode in ascii ascii-color blocks halfblock braille kitty iterm sixel; do
            tinycinema /tmp/clip.mp4 --once --width 40 --height 12 \
              --mode "$mode" --no-audio > "/tmp/out-$mode" || exit 1
            test -s "/tmp/out-$mode" || { echo "$mode produced nothing"; exit 1; }
            echo "  $mode: $(wc -c < /tmp/out-$mode) bytes"
          done

      - name: Recording and frame dumping
        shell: bash
        run: |
          script -qec "tinycinema /tmp/clip.mp4 --no-audio --no-hud --fps 10 \
            --width 40 --height 12 --record /tmp/r.cast --frames /tmp/frames \
            > /dev/null" /dev/null
          python - <<'EOF'
          import json, pathlib
          lines = pathlib.Path("/tmp/r.cast").read_text().splitlines()
          header = json.loads(lines[0])
          assert header["version"] == 2, header
          events = [json.loads(x) for x in lines[1:]]
          assert len(events) > 5, f"only {len(events)} events recorded"
          assert all(e[1] == "o" for e in events)
          times = [e[0] for e in events]
          assert times == sorted(times), "cast timestamps must not go backwards"
          frames = sorted(pathlib.Path("/tmp/frames").iterdir())
          assert len(frames) > 5, f"only {len(frames)} frames dumped"
          print(f"OK: {len(events)} cast events, {len(frames)} frames")
          EOF

      - name: Playlists
        shell: bash
        run: |
          mkdir -p /tmp/pl && cp /tmp/clip.mp4 /tmp/pl/ep1.mp4 \
            && cp /tmp/clip.mp4 /tmp/pl/ep2.mp4
          tinycinema /tmp/pl --once --width 40 --height 12 --no-audio > /dev/null
          tinycinema /tmp/pl --shuffle --once --width 40 --height 12 --no-audio > /dev/null

      - name: --doctor reports a healthy setup
        run: tinycinema --doctor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests tools

  package:
    name: package builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: A wheel install exposes both console scripts
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/tinycinema --version
          /tmp/fresh/bin/tcin --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  assets:
    name: demo assets are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Regenerate and diff
        run: |
          python tools/make_demo_assets.py
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ is stale -- run python tools/make_demo_assets.py"
            exit 1
          }
